version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: safety_monitor_db
    environment:
      POSTGRES_USER: safety_user
      POSTGRES_PASSWORD: safety_password
      POSTGRES_DB: safety_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety_user -d safety_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（用于会话和消息队列）
  redis:
    image: redis:7-alpine
    container_name: safety_monitor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safety_monitor_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://safety_user:safety_password@postgres:5432/safety_monitor
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_data:/app/app/ml/models
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 前端 Web 服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safety_monitor_web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  model_data:
